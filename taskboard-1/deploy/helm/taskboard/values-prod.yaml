# EKS: ECR image, ExternalSecret (AWS Secrets Manager), gp3 volume, TargetGroupBinding.
# Fill the CHANGE_ME values from the Terraform outputs (Phase B3).
backend:
  replicas: 2
  image:
    repository: CHANGE_ME   # output ecr_repository_url, e.g. 123456789012.dkr.ecr.eu-west-1.amazonaws.com/taskboard-backend
    tag: sha-CHANGE_ME      # release-managed  (the release workflow rewrites this line)
    pullPolicy: IfNotPresent
  environment: production

postgres:
  storage:
    size: 5Gi
    storageClass: ebs-csi-default-sc   # created by the aws-ebs-csi-driver add-on (defaultStorageClass.enabled) -> gp3

credentials:
  mode: external
  external:
    region: eu-west-1
    remoteKey: taskboard/prod/db-password   # output db_secret_name
    refreshInterval: 1h

targetGroupBinding:
  enabled: true
  targetGroupArn: CHANGE_ME   # output backend_target_group_arn
