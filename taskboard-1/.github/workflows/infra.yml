name: Infrastructure

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/actions/**"
      - ".trivyignore"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: no AWS access keys anywhere

# two Terraform runs must never touch the same state at the same time
concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_DIR: infra/environments/prod
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_infra_role_arn: ${{ vars.AWS_INFRA_ROLE_ARN }}
  TF_VAR_eks_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS }}
  TF_VAR_region: ${{ vars.AWS_REGION }}

jobs:
  plan:
    name: Scan, fmt, validate, plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: IaC security scan (Trivy misconfig) + secret scanners
        uses: ./.github/actions/pre-build-scan
        with:
          scan-path: infra
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gitleaks-license: ${{ secrets.GITLEAKS_LICENSE }}
          artifact-name: infra-pre-build-scan

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff infra

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          set +e
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          # 0 = no changes, 2 = changes, 1 = error
          [ "$code" -eq 1 ] && exit 1
          {
            echo "## Terraform plan"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  apply:
    name: Apply (needs approval)
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # required reviewer configured on this GitHub environment: the apply waits for a human
    environment: infrastructure
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # No plan file is passed between the jobs on purpose: this repository is public and a plan file contains secrets.
      - name: terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -no-color -lock-timeout=10m

      - name: Outputs (copy them to GitHub variables / values-prod.yaml)
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "## Terraform outputs"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
