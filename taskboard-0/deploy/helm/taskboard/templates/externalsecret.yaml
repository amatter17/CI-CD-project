{{- if eq .Values.credentials.mode "external" }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "taskboard.fullname" . }}-aws
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.credentials.external.region | quote }}
      # no auth block: the External Secrets Operator pod uses its EKS Pod Identity role
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "taskboard.fullname" . }}-db
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.credentials.external.refreshInterval | quote }}
  secretStoreRef:
    kind: SecretStore
    name: {{ include "taskboard.fullname" . }}-aws
  target:
    name: {{ include "taskboard.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ required "credentials.external.remoteKey is required when credentials.mode=external" .Values.credentials.external.remoteKey | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
