{{- if eq .Values.credentials.mode "plain" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.secretName" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "credentials.plain.password is required when credentials.mode=plain" .Values.credentials.plain.password | quote }}
{{- end }}
